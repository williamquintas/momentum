name: Version Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  version-consistency:
    name: Version Consistency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate package and lockfile versions
        run: node scripts/check-version.js maintenance

      - name: Test maintenance and release version policy
        run: node --test scripts/check-version.node-test.js

      - name: Check version in CHANGELOG
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Check if version exists in CHANGELOG.md
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "⚠️  Warning: Version $VERSION not found in CHANGELOG.md"
            echo "Consider adding an entry for this version in the [Unreleased] section"
          else
            echo "✅ Version $VERSION found in CHANGELOG.md"
          fi
