name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag already integrated into main (for example v0.3.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Existing Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      build_date: ${{ steps.release.outputs.build_date }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout existing tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Run this gate before executing any project code or installation scripts.
      - name: Require tag commit integrated into main
        shell: bash
        run: |
          # fetch-depth: 0 above fetches all branches, including private repositories.
          # Do not fetch again after checkout removes its temporary credentials.
          git rev-parse --verify refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          node scripts/check-version.js maintenance
          node scripts/check-version.js tag "$RELEASE_TAG"
          node scripts/check-release-commit.js
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${pkg.version.split("+")[0].includes("-")}\n`);'

      - name: Install dependencies
        run: npm ci

      - name: Check types, lint and formatting
        run: npm run validate

      - name: Validate translations
        run: npm run validate:translations

      - name: Test release and branch policies
        run: node --test scripts/check-version.node-test.js scripts/check-release-commit.node-test.js scripts/check-gitflow.node-test.js

      - name: Test application
        run: npm test -- --run

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build validated commit
        run: npm run build
        env:
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
          VITE_APP_GIT_SHA: ${{ steps.release.outputs.sha }}
          VITE_APP_BUILD_DATE: ${{ steps.release.outputs.build_date }}

      - name: Package build
        run: tar -czf momentum-dist.tar.gz -C dist .

      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-build
          path: momentum-dist.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish Validated Build
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      RELEASE_BUILD_DATE: ${{ needs.validate.outputs.build_date }}
    steps:
      - name: Verify existing tag still resolves to validated commit
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Reject changed tag
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: validated-release-build

      - name: Publish existing tag and validated artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Commit: %s\nBuild date: %s\n' "$RELEASE_SHA" "$RELEASE_BUILD_DATE" > release-notes.txt
          args=()
          if [ "$RELEASE_PRERELEASE" = 'true' ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" momentum-dist.tar.gz --verify-tag --title "Release $RELEASE_TAG" --notes-file release-notes.txt --generate-notes "${args[@]}"
